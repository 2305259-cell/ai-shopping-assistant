<!DOCTYPE html>
<html>

<head>

    <title>AI Shopping Assistant</title>

    <style>

        body{
            font-family: Arial;
            background:#e6ecf0;
            margin:0;
            padding:0;
        }

        .container{
            width:500px;
            margin:50px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            color:#333;
        }

        .input-area{
            display:flex;
            gap:10px;
        }

        input{
            flex:1;
            padding:10px;
            border:1px solid gray;
            border-radius:5px;
        }

        button{
            padding:10px 20px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        #chat{
            margin-top:20px;
        }

        .user{
            background:#d1e7dd;
            padding:10px;
            border-radius:5px;
            margin-top:10px;
        }

        .bot{
            background:#f8d7da;
            padding:10px;
            border-radius:5px;
            margin-top:10px;
        }

        .product{
            background:#f1f1f1;
            padding:10px;
            margin-top:10px;
            border-radius:5px;
        }

        img{
            border-radius:5px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>AI Shopping Assistant</h1>

    <div class="input-area">

        <input type="text"
               id="message"
               placeholder="Ask for phones or shoes">

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

    <div id="chat"></div>

</div>

<script>

async function sendMessage(){

    let message =
    document.getElementById("message").value;

    let response = await fetch("/chat", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            message:message
        })

    });

    let data = await response.json();

    let chat =
    document.getElementById("chat");

    chat.innerHTML += `

        <div class="user">
            <b>You:</b> ${message}
        </div>

    `;

    chat.innerHTML += `

        <div class="bot">
            <b>Bot:</b> ${data.reply}
        </div>

    `;

    data.products.forEach(product => {

        chat.innerHTML += `

            <div class="product">

                <img src="${product.image}" width="100">

                <h3>${product.name}</h3>

                <p>Price: ₹${product.price}</p>

                <p>Category: ${product.category}</p>

            </div>

        `;

    });

}

document.getElementById("message")
.addEventListener("keypress", function(event){

    if(event.key === "Enter"){

        sendMessage();

    }

});

</script>

</body>

</html>
